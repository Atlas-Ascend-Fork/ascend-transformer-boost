name: arm_compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string

jobs:
  JOB_compile:
    name: compile
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          token: ${{secrets.GIT_TOKEN}}
      -
        name: oidc_auth
        uses: huaweicloud-oidc-auth
        with:
          audience: ${{ secrets.audience }}
          agency_urn: ${{ secrets.agency_urn }}
          provider_urn: ${{ secrets.provider_urn }}
          region: cn-north-4
          duration: 3600
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/compile_test_framework.sh
            ${{ env.obs_path }}/common.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: arm_compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            export TARGET_BRANCH=${{ env.target_branch }}
            cd ${{ steps.process_checkout.outputs.path }}
            BuildAccelerate bash compile_test_framework.sh
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      - name: tar_ut
        run: |
            if [ -d output ];then
              tar -zcf atb_test_framework.tar.gz output
            else
              tar -zcf atb_test_framework.tar.gz -T /dev/null
            fi
            echo "atb_test_framework.tar.gz is generated in $(pwd):"
            ls -lh atb_test_framework.tar.gz
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          artifact-path: |
            ${{ steps.process_checkout.outputs.path }}/atb_test_framework.tar.gz
          object-prefix: ${{ env.obs_path }}/test_framework/arm64/
    if: "${{ default() }}"
    runs-on: [self-hosted, arch=arm64, spec=xlarge]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/${{ inputs.image_version }}
